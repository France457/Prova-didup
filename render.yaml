services:
  - type: web
    name: diario-scolastico
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 main:app
    healthCheckPath: /healthz
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
