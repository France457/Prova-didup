<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Diario scolastico per compiti, promemoria e studio.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/app-180.png">
  <title>Diario scolastico</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #244d70;
      --navy-deep: #203f60;
      --blue: #3282e8;
      --blue-pale: #e8f2ff;
      --red: #f05262;
      --green: #29bd8e;
      --yellow: #ffb900;
      --purple: #8b5ce7;
      --ink: #172f50;
      --muted: #70839c;
      --line: #e8edf4;
      --canvas: #f4f7fb;
      --white: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid #90c3ff; outline-offset: 2px; }
    .app { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 5; display: flex; width: 114px; flex-direction: column;
      padding: 15px 7px; background: linear-gradient(180deg, #285578, #244665 65%, #21435f); color: white;
    }
    .brand { display: grid; justify-items: center; gap: 1px; margin: 0 0 22px; }
    .brand-mark { color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.08em; }
    .brand-mark span { color: #45c399; }
    .brand-caption { color: #d2dfec; font-size: 8px; letter-spacing: .08em; }
    .navigation { display: grid; gap: 4px; overflow-y: auto; scrollbar-width: none; }
    .navigation::-webkit-scrollbar { display: none; }
    .nav-button {
      display: grid; min-height: 48px; justify-items: center; align-content: center; gap: 3px;
      padding: 4px 2px; border: 0; border-radius: 7px; background: transparent; color: #e6eff8;
      cursor: pointer; font-size: 9px; transition: background .2s ease, transform .2s ease;
    }
    .nav-button:hover { transform: translateX(2px); background: rgb(255 255 255 / 10%); }
    .nav-button[aria-current="page"] { background: #397ab5; box-shadow: 0 3px 10px rgb(14 37 60 / 15%); color: white; }
    .nav-icon { font-size: 17px; line-height: 1; }
    .ai-nav { margin-top: auto; padding: 8px; border-top: 1px solid rgb(255 255 255 / 12%); }
    .ai-nav[hidden] { display: none; }
    .exit-ai { min-height: 31px; padding: 0 10px; border: 1px solid #e0e8f3; border-radius: 7px; background: white; color: var(--navy); cursor: pointer; font-size: 10px; font-weight: 700; }
    .exit-ai[hidden] { display: none; }
    .main { min-height: 100vh; margin-left: 114px; }
    .topbar {
      position: sticky; top: 0; z-index: 4; display: flex; height: 60px; align-items: center; gap: 20px;
      padding: 0 22px; border-bottom: 1px solid #e9edf3; background: rgb(255 255 255 / 88%); backdrop-filter: blur(16px);
    }
    .top-brand { display: none; }
    .search-wrap { position: relative; width: min(315px, 38vw); }
    .search-icon { position: absolute; top: 50%; left: 13px; color: #8798ac; font-size: 17px; transform: translateY(-52%); pointer-events: none; }
    .search { width: 100%; height: 38px; padding: 0 13px 0 39px; border: 1px solid transparent; border-radius: 22px; outline: none; background: #f1f4f8; color: var(--ink); font-size: 12px; transition: border .2s, box-shadow .2s, background .2s; }
    .search:focus { border-color: #b7d3f3; background: white; box-shadow: 0 0 0 3px rgb(50 130 232 / 8%); }
    .top-actions { display: flex; align-items: center; gap: 15px; margin-left: auto; }
    .icon-button { position: relative; display: grid; width: 35px; height: 35px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #536b86; cursor: pointer; font-size: 18px; transition: background .2s, color .2s; }
    .icon-button:hover { background: var(--blue-pale); color: var(--blue); }
    .notification-count { position: absolute; top: 1px; right: 1px; display: grid; min-width: 15px; height: 15px; place-items: center; padding: 0 3px; border: 1px solid white; border-radius: 10px; background: var(--red); color: white; font-size: 9px; font-weight: 800; }
    .profile { display: flex; align-items: center; gap: 9px; }
    .profile-button { padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; text-align: left; }
    .profile-button:hover .avatar { box-shadow: 0 0 0 4px var(--blue-pale); }
    .avatar { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; background: var(--blue); color: white; font-size: 13px; font-weight: 700; }
    .profile-name { font-size: 11px; font-weight: 700; }
    .profile-role { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .profile-arrow { margin-left: 2px; color: var(--muted); font-size: 12px; }
    .account-card { max-width: 780px; margin: 0 auto; padding: 25px; }
    .account-intro { display: flex; align-items: center; gap: 15px; margin-bottom: 22px; padding: 18px; border-radius: 12px; background: linear-gradient(120deg, #edf5ff, #f5f0ff); }
    .account-avatar { display: grid; width: 58px; height: 58px; flex: 0 0 58px; place-items: center; border-radius: 50%; background: linear-gradient(140deg, #3282e8, #755be8); box-shadow: 0 6px 16px rgb(50 130 232 / 20%); color: white; font-size: 19px; font-weight: 750; }
    .account-intro h2 { margin: 0; font-size: 16px; }
    .account-intro p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .account-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 11px; font-weight: 700; }
    .field-label { font-size: 11px; font-weight: 700; }
    .field input { width: 100%; min-height: 43px; padding: 0 12px; border: 1px solid #dfe6ef; border-radius: 8px; outline: 0; background: #fbfcfe; color: var(--ink); font-size: 12px; transition: border .18s, box-shadow .18s, background .18s; }
    .field input:focus { border-color: #80b5f0; background: white; box-shadow: 0 0 0 3px rgb(50 130 232 / 10%); }
    .account-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 21px; }
    .save-status { min-height: 18px; margin: 0; color: var(--green); font-size: 11px; }
    .save-status.error { color: var(--red); }
    .save-button { min-height: 41px; padding: 0 19px; border: 0; border-radius: 8px; background: linear-gradient(110deg, #3282e8, #426fe1); box-shadow: 0 5px 12px rgb(50 130 232 / 18%); color: white; cursor: pointer; font-size: 12px; font-weight: 700; transition: transform .18s, box-shadow .18s; }
    .save-button:hover { transform: translateY(-2px); box-shadow: 0 8px 17px rgb(50 130 232 / 25%); }
    .account-note { margin: 17px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .argo-setup { width: min(100%, 620px); margin: 30px auto; padding: 26px; }
    .argo-setup h2 { margin: 0 0 8px; font-size: 17px; }
    .argo-setup-copy { margin: 0 0 20px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .argo-setup-form { display: grid; gap: 15px; }
    .argo-notice { margin: 16px 0 0; padding: 12px; border-radius: 8px; background: #fff8e8; color: #765719; font-size: 10px; line-height: 1.6; }
    .argo-status { min-height: 18px; margin: 0; color: var(--green); font-size: 11px; }
    .argo-status.error { color: var(--red); }
    .argo-onboarding .sidebar, .argo-onboarding .topbar { display: none; }
    .argo-onboarding .main { margin-left: 0; }
    .argo-onboarding .content { display: grid; min-height: 100vh; align-content: center; padding: 24px; }
    .auth-gate { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #e8f2ff, transparent 55%), var(--canvas); }
    .auth-card { width: min(100%, 390px); padding: 28px; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 16px 45px rgb(34 65 97 / 10%); }
    .auth-mark { display: grid; width: 52px; height: 52px; place-items: center; margin-bottom: 18px; border-radius: 15px; background: linear-gradient(140deg, #3282e8, #755be8); color: white; font-size: 24px; font-weight: 800; }
    .auth-card h1 { margin: 0; color: var(--ink); font-size: 21px; }
    .auth-copy { margin: 8px 0 20px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .auth-form { display: grid; gap: 12px; }
    .auth-form[hidden] { display: none; }
    .auth-form label { display: grid; gap: 7px; font-size: 12px; font-weight: 700; }
    .auth-form input { width: 100%; min-height: 46px; padding: 0 12px; border: 1px solid #dfe6ef; border-radius: 8px; background: #fbfcfe; color: var(--ink); font-size: 16px; }
    .auth-submit { min-height: 44px; border: 0; border-radius: 8px; background: linear-gradient(110deg, #3282e8, #426fe1); color: white; cursor: pointer; font-size: 13px; font-weight: 700; }
    .auth-submit:disabled { cursor: wait; opacity: .65; }
    .auth-status { min-height: 18px; margin: 0; color: var(--red); font-size: 12px; line-height: 1.45; }
    .app[hidden], .auth-gate[hidden] { display: none; }
    [data-logout] { padding: 7px 9px; border: 1px solid #e2e8f0; border-radius: 7px; background: white; color: var(--navy); cursor: pointer; font-size: 10px; font-weight: 700; }
    .ai-planner { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .78fr); gap: 18px; align-items: center; overflow: hidden; margin-bottom: 15px; padding: 18px 20px; border-color: #dfe8fa; background: linear-gradient(115deg, #f0f6ff, #f7f2ff 68%, #fff); }
    .ai-planner::after { position: absolute; top: -65px; right: 30%; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, rgb(126 114 238 / 12%), transparent 70%); content: ""; pointer-events: none; }
    .ai-planner-copy, .ai-planner-action { position: relative; z-index: 1; }
    .ai-eyebrow { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 7px; color: #7057cc; font-size: 9px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .ai-planner h2 { margin: 0; font-size: 15px; }
    .ai-planner-copy p { max-width: 430px; margin: 5px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .ai-planner-action { display: grid; gap: 8px; }
    .api-key-row { display: flex; gap: 7px; }
    .api-key-input { width: 100%; min-width: 0; height: 37px; padding: 0 11px; border: 1px solid #dfe4f0; border-radius: 8px; outline: 0; background: rgb(255 255 255 / 85%); color: var(--ink); font-size: 11px; transition: border .18s, box-shadow .18s; }
    .api-key-input:focus { border-color: #9580e9; box-shadow: 0 0 0 3px rgb(139 92 231 / 11%); }
    .ai-button { min-height: 37px; padding: 0 12px; border: 0; border-radius: 8px; background: linear-gradient(110deg, #7659df, #4984e4); box-shadow: 0 4px 11px rgb(97 94 218 / 20%); color: white; cursor: pointer; font-size: 10px; font-weight: 750; white-space: nowrap; transition: transform .18s, box-shadow .18s, opacity .18s; }
    .ai-button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 7px 15px rgb(97 94 218 / 25%); }
    .ai-button:disabled { cursor: wait; opacity: .65; }
    .ai-key-note, .ai-status { min-height: 14px; margin: 0; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .ai-status.error { color: var(--red); }
    .ai-status.success { color: var(--green); }
    .ai-plan-result { margin-top: 11px; padding: 13px 15px; border: 1px solid #e7e1fc; border-radius: 9px; background: rgb(255 255 255 / 86%); font-size: 11px; line-height: 1.65; white-space: pre-wrap; }
    .ai-plan-result[hidden] { display: none; }
    .planning-promo { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; overflow: hidden; margin: 0 0 15px; padding: 12px 15px; border: 1px solid #e2e6fb; border-radius: 11px; background: linear-gradient(105deg, #f0f5ff, #f8f1ff 64%, #fff7f0); box-shadow: 0 3px 11px rgb(64 75 132 / 4%); cursor: pointer; text-align: left; transition: transform .2s, box-shadow .2s, border-color .2s; animation: rise-in .45s .04s both; }
    .planning-promo:hover { transform: translateY(-2px); border-color: #cbd1f4; box-shadow: 0 9px 20px rgb(64 75 132 / 10%); }
    .planning-promo-copy { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .planning-promo-icon { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 11px; background: linear-gradient(145deg, #e9e5ff, #e7f1ff); color: #7559dd; font-size: 19px; }
    .planning-promo-title { display: block; color: #263967; font-size: 12px; font-weight: 750; }
    .planning-promo-text { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .planning-promo-action { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; color: #7159d1; font-size: 10px; font-weight: 750; }
    .planning-promo-arrow { font-size: 17px; transition: transform .2s; }
    .planning-promo:hover .planning-promo-arrow { transform: translateX(3px); }
    .planning-page { display: grid; width: min(100%, 920px); gap: 14px; margin: 0 auto; }
    .planning-hero { position: relative; overflow: hidden; padding: 22px; border: 1px solid #e5e4fb; border-radius: 14px; background: linear-gradient(115deg, #f0f5ff, #f5f0ff 58%, #fff6f2); }
    .planning-hero::after { position: absolute; top: -75px; right: 8%; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgb(117 89 221 / 13%), transparent 70%); content: ""; pointer-events: none; }
    .planning-hero > * { position: relative; z-index: 1; }
    .planning-hero h2 { margin: 3px 0 6px; font-size: 18px; }
    .planning-hero p { max-width: 580px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .planning-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, .72fr); gap: 14px; align-items: start; }
    .planning-card { padding: 17px; }
    .planning-card h2 { margin: 0; font-size: 13px; }
    .planning-card > p { margin: 6px 0 13px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .planning-key-row { display: grid; gap: 8px; }
    .planning-key-status { display: flex; align-items: center; gap: 7px; min-height: 17px; margin: 0; color: var(--muted); font-size: 9px; }
    .planning-key-status.connected { color: var(--green); }
    .planning-key-status.error { color: var(--red); }
    .planning-key-status::before { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: currentColor; content: ""; }
    .planning-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ai-secondary-button { min-height: 34px; padding: 0 11px; border: 1px solid #e2e5f0; border-radius: 7px; background: white; color: #6355b6; cursor: pointer; font-size: 10px; font-weight: 700; transition: background .18s, transform .18s; }
    .ai-secondary-button:hover:not(:disabled) { transform: translateY(-1px); background: #f6f3ff; }
    .ai-secondary-button:disabled { cursor: not-allowed; opacity: .5; }
    .planning-result { min-height: 74px; margin-top: 12px; padding: 12px; border: 1px dashed #dcd9f4; border-radius: 8px; background: #fcfbff; color: #394967; font-size: 10px; line-height: 1.65; white-space: pre-wrap; }
    .planning-result:empty::before { color: #99a6b9; content: "Il tuo piano di studio apparirà qui."; }
    .planning-task-list { display: grid; gap: 8px; }
    .planning-task { display: flex; align-items: flex-start; gap: 8px; color: #42536b; font-size: 10px; line-height: 1.45; }
    .planning-task::before { width: 7px; height: 7px; flex: 0 0 7px; margin-top: 4px; border-radius: 50%; background: #8067df; content: ""; }
    .planning-list-heading { margin: 15px 0 8px; color: var(--ink); font-size: 11px; }
    .planning-list-heading { margin: 15px 0 8px; color: var(--ink); font-size: 11px; }
    .chat-shell { display: grid; width: min(100%, 900px); min-height: min(660px, calc(100vh - 190px)); grid-template-rows: auto minmax(180px, 1fr) auto; overflow: hidden; margin: 0 auto; }
    .chat-shell[hidden] { display: none; }
    .chat-shell { display: grid; width: min(100%, 900px); min-height: min(660px, calc(100vh - 190px)); grid-template-rows: auto minmax(180px, 1fr) auto; overflow: hidden; margin: 0 auto; }
    .chat-heading { display: flex; align-items: center; gap: 12px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .chat-heading-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 12px; background: linear-gradient(140deg, #eee9ff, #e8f2ff); color: #7659df; font-size: 20px; }
    .chat-heading h2 { margin: 0; font-size: 14px; }
    .chat-heading p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .chat-heading .text-button { margin-left: auto; }
    .chat-messages { display: flex; flex-direction: column; gap: 13px; overflow: auto; padding: 19px 20px; }
    .chat-message { display: flex; max-width: min(82%, 610px); align-items: flex-start; gap: 9px; animation: rise-in .24s both; }
    .chat-message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message-avatar { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 50%; background: #eee9ff; color: #7659df; font-size: 12px; font-weight: 750; }
    .chat-message.user .message-avatar { background: var(--blue-pale); color: var(--blue); }
    .message-bubble { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px 12px 12px; background: #f8faff; color: var(--ink); font-size: 11px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chat-message.user .message-bubble { border-color: #d7e8ff; border-radius: 12px 4px 12px 12px; background: #edf5ff; }
    .chat-message.loading .message-bubble { color: var(--muted); }
    .chat-composer { padding: 14px 18px 16px; border-top: 1px solid var(--line); background: #fcfdff; }
    .chat-form { display: flex; align-items: flex-end; gap: 9px; }
    .chat-input { width: 100%; min-height: 43px; max-height: 130px; resize: vertical; padding: 11px 12px; border: 1px solid #dfe6ef; border-radius: 9px; outline: 0; background: white; color: var(--ink); font-size: 11px; line-height: 1.5; }
    .chat-input:focus { border-color: #9580e9; box-shadow: 0 0 0 3px rgb(139 92 231 / 10%); }
    .chat-footnote { margin: 8px 2px 0; color: var(--muted); font-size: 9px; }
    .chat-setup { width: min(100%, 560px); margin: 30px auto; padding: 23px; }
    .chat-setup .ai-planner-action { margin-top: 17px; }
    .chat-empty-state { max-width: 360px; margin: auto; padding: 24px 16px; color: var(--muted); font-size: 11px; line-height: 1.6; text-align: center; }
    .chat-empty-state .message-avatar { width: 39px; height: 39px; margin: 0 auto 10px; font-size: 17px; }
    .content { width: min(100%, 1440px); margin: 0 auto; padding: 27px 16px 38px; }
    .welcome { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 19px; animation: rise-in .45s both; }
    .page-heading { margin: 0; font-size: clamp(22px, 2.4vw, 27px); letter-spacing: -.035em; }
    .page-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .date-chip { flex: 0 0 auto; padding: 12px 15px; border: 1px solid #e7edf4; border-radius: 12px; background: white; box-shadow: 0 3px 14px rgb(35 64 92 / 3%); font-size: 12px; font-weight: 700; }
    .date-chip span { margin-left: 6px; color: var(--blue); }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 17px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { min-width: 0; border: 1px solid #e9eef4; border-radius: 12px; background: var(--white); box-shadow: 0 3px 12px rgb(31 58 86 / 3%); }
    .stat { position: relative; min-height: 126px; overflow: hidden; padding: 14px; transition: transform .22s ease, box-shadow .22s ease; }
    .stat:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgb(31 58 86 / 10%); }
    .stat::after { position: absolute; right: -19px; bottom: -28px; width: 92px; height: 92px; border-radius: 50%; background: var(--tint); content: ""; opacity: .55; transition: transform .35s ease; }
    .stat:hover::after { transform: scale(1.25); }
    .stat.blue-card { --accent: #3282e8; --tint: #e8f2ff; background: linear-gradient(135deg, #fff, #f4f9ff); }
    .stat.red-card { --accent: #f05262; --tint: #ffedf0; background: linear-gradient(135deg, #fff, #fff4f5); }
    .stat.green-card { --accent: #22b888; --tint: #e9faf3; background: linear-gradient(135deg, #fff, #f1fbf7); }
    .stat.gold-card { --accent: #e7a400; --tint: #fff4d8; background: linear-gradient(135deg, #fff, #fffaf0); }
    .stat-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
    .stat-icon { display: grid; width: 43px; height: 43px; place-items: center; border-radius: 13px; background: var(--tint); color: var(--accent); font-size: 22px; }
    .stat-arrow { color: var(--accent); font-size: 17px; transition: transform .2s ease; }
    .stat:hover .stat-arrow { transform: translateX(4px); }
    .stat-value { position: relative; z-index: 1; display: block; margin-top: 9px; font-size: 21px; font-weight: 750; }

<body>
  <section class="auth-gate" id="auth-gate" aria-labelledby="auth-title" hidden>
    <div class="auth-card">
      <div class="auth-mark" aria-hidden="true">◠</div>
      <h1 id="auth-title">Diario scolastico</h1>
      <p class="auth-copy" id="auth-copy">Accedi per aprire il diario e usare l'assistente AI.</p>
      <form class="auth-form" id="auth-form">
        <label for="app-password">Password di accesso</label>
        <input id="app-password" name="password" type="password" autocomplete="current-password" required>
        <button class="auth-submit" type="submit">Accedi</button>
        <p class="auth-status" id="auth-status" role="status"></p>
      </form>
    </div>
  </section>
  <div class="app" hidden>
    <aside class="sidebar" aria-label="Navigazione principale">
      <div class="brand">
        <div class="brand-mark">◠ <span>didUP</span></div>
        <div class="brand-caption">ARGO</div>
      </div>
      <nav class="navigation" aria-label="Menu">
        <button class="nav-button" data-page="Home" aria-current="page"><span class="nav-icon">⌂</span>Home</button>
        <button class="nav-button" data-page="Compiti"><span class="nav-icon">▣</span>Compiti</button>
        <button class="nav-button" data-page="Promemoria"><span class="nav-icon">♟</span>Promemoria</button>
        <button class="nav-button" data-page="Account"><span class="nav-icon">♙</span>Account</button>
      </nav>
      <div class="sidebar-note" aria-hidden="true"><span class="sidebar-note-icon">🎓</span><span>Piccoli passi,<br>grandi traguardi</span><span class="sidebar-note-leaf">✦</span></div>
      <div class="ai-nav" id="ai-nav" hidden><button class="exit-ai" type="button" data-page="Home">Torna al diario</button></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-brand">didUP</div>
        <button class="exit-ai" id="exit-ai-top" type="button" data-exit-planning hidden>← Diario</button>
        <label class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input class="search" id="search" type="search" placeholder="Cerca compiti, materie, promemoria..." aria-label="Cerca compiti e promemoria">
        </label>
        <div class="top-actions">
          <button class="icon-button" type="button" aria-label="Notifiche" title="Notifiche">♟<span class="notification-count">3</span></button>
          <button type="button" data-logout>Esci</button>
          <button class="profile profile-button" type="button" data-page="Account" aria-label="Apri il tuo account">
            <span class="avatar" id="profile-avatar" aria-hidden="true">S</span>
            <span class="profile-copy"><span class="profile-name" id="profile-name">Studente</span><span class="profile-role" id="profile-role">Studente</span></span>
            <span class="profile-arrow" aria-hidden="true">⌄</span>
          </button>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <script>
    const API_CONFIG = {
      google: {
        models: { "gemini-2.5": "gemini-2.5", "gemini-2.5-chat": "gemini-2.5-chat" }
      }
    };
    let assignments = [];
    let reminders = [];
    const content = document.querySelector("#content");
    const search = document.querySelector("#search");
    const navigation = document.querySelector(".navigation");
    const normalNavigation = [
      ["Home", "⌂"],
      ["Compiti", "▣"],
      ["Compiti passati", "◷"],
      ["Promemoria", "♟"],
      ["Promemoria passati", "◴"],
      ["Account", "♙"]
    ];
    const aiNavigation = [
      ["Planning", "✦"],
      ["Chat", "☷"]
    ];
    const today = new Date();
    let currentPage = "Home";
    let homeTaskFilter = "today";
    let homeReminderFilter = "today";
    let taskStatusFilter = "all";
    let taskSubjectFilter = "";
    let taskSortOrder = "due";
    let taskViewMode = "list";
    let taskSelectedDate = "";
    let reminderFilter = "all";
    let reminderSortOrder = "date";
    let reminderViewMode = "list";
    let reminderSelectedDate = "";
    let localReminders = [];
    const collapsedTaskGroups = new Set();
    let wasAuthenticated = false;
    let returnToAccountAfterArgo = false;
    const defaultAccountPreferences = {
      theme: "light",
      homeworkNotifications: true,
      reminderNotifications: true,
      aiPlanning: true,
      language: "it"
    };
    let subjectsEditorOpen = false;
    let profileStatus = "";
    let aiMode = false;
    let geminiApiConfigured = false;
    let geminiConfigLoaded = false;
    let geminiConfigError = "";
    let csrfToken = "";
    let localAuthBypass = false;
    let chatHistory = [];
    let chatBusy = false;
    let planningBusy = false;
    let chatStatus = "";
    let planningStatus = "";
    let planningResult = "";
    let calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let selectedDay = today.getDate();
    let completed = new Set();
    let argoConnected = false;
    let argoImportedAt = "";
    let argoSyncStatus = "";
    let argoSyncFailed = false;
    let localTasks = [];
    let account = {
      firstName: "", lastName: "", school: "", schoolYear: "",
      email: "", birthDate: "", phone: "", section: "", address: "",
      academicYear: "", academicYearAuto: true, avatarImage: "", coverImage: "", subjects: [],
      targetAverage: "", studyGoal: "",
      preferences: { ...defaultAccountPreferences }
    };
    try {
      const savedAccount = JSON.parse(localStorage.getItem("diario-account") || "null");
      if (savedAccount && typeof savedAccount === "object") {
        account = {
          firstName: typeof savedAccount.firstName === "string" ? savedAccount.firstName : "",
          lastName: typeof savedAccount.lastName === "string" ? savedAccount.lastName : "",
          school: typeof savedAccount.school === "string" ? savedAccount.school : "",
          schoolYear: typeof savedAccount.schoolYear === "string" ? savedAccount.schoolYear : "",
          email: typeof savedAccount.email === "string" ? savedAccount.email : "",
          birthDate: typeof savedAccount.birthDate === "string" ? savedAccount.birthDate : "",
          phone: typeof savedAccount.phone === "string" ? savedAccount.phone : "",
          section: typeof savedAccount.section === "string" ? savedAccount.section : "",
          address: typeof savedAccount.address === "string" ? savedAccount.address : "",
          academicYear: typeof savedAccount.academicYear === "string" ? savedAccount.academicYear : "",
          academicYearAuto: savedAccount.academicYearAuto !== false,
          avatarImage: typeof savedAccount.avatarImage === "string" ? savedAccount.avatarImage : "",
          coverImage: typeof savedAccount.coverImage === "string" ? savedAccount.coverImage : "",
          subjects: Array.isArray(savedAccount.subjects) ? savedAccount.subjects.filter(item => typeof item === "string").slice(0, 20) : [],
          targetAverage: typeof savedAccount.targetAverage === "string" ? savedAccount.targetAverage : "",
          studyGoal: typeof savedAccount.studyGoal === "string" ? savedAccount.studyGoal : "",
          preferences: savedAccount.preferences && typeof savedAccount.preferences === "object"
            ? { ...defaultAccountPreferences, ...savedAccount.preferences }
            : { ...defaultAccountPreferences }
        };
      }
    } catch (error) {
      console.warn("Non è stato possibile leggere l'account salvato nel browser.", error);
    }
    account.preferences = {
      ...defaultAccountPreferences,
      ...account.preferences,
      theme: account.preferences.theme === "dark" ? "dark" : "light",
      homeworkNotifications: account.preferences.homeworkNotifications !== false,
      reminderNotifications: account.preferences.reminderNotifications !== false,
      aiPlanning: account.preferences.aiPlanning !== false,
      language: "it"
    };
    account.targetAverage = account.targetAverage.trim() && Number.isFinite(Number(account.targetAverage))
      ? String(Math.min(10, Math.max(1, Number(account.targetAverage))))
      : "";
    if (account.academicYearAuto || !account.academicYear.trim()) {
      account.academicYear = getCurrentAcademicYear();
      account.academicYearAuto = true;
      try {
        localStorage.setItem("diario-account", JSON.stringify(account));
      } catch (error) {
        console.warn("Non è stato possibile salvare l'anno scolastico nel browser.", error);
      }
    }
    document.body.dataset.theme = account.preferences.theme === "dark" ? "dark" : "light";
    try {
      const saved = JSON.parse(localStorage.getItem("diario-argo-completed") || "[]");
      if (Array.isArray(saved) && saved.every(item => typeof item === "string")) completed = new Set(saved);
    } catch (error) {
      console.warn("Non è stato possibile leggere i compiti salvati nel browser.", error);
    }
    try {
      const savedArgo = JSON.parse(localStorage.getItem("diario-argo-data") || "null");
      if (savedArgo && savedArgo.connected === true
        && savedArgo.data && Array.isArray(savedArgo.data.assignments) && Array.isArray(savedArgo.data.reminders)) {
        const imported = prepareArgoData(savedArgo.data);
        assignments = [...imported.assignments, ...localTasks.map(createLocalAssignment)];
        reminders = [...imported.reminders, ...localReminders.map(createLocalReminder)];
        argoConnected = true;
        argoImportedAt = typeof savedArgo.importedAt === "string" ? savedArgo.importedAt : "";

          && typeof task.title === "string" && task.title.trim()
          && dateFromISO(task.due)

    function filtered(items) {
      const query = search.value.trim().toLocaleLowerCase("it");
      if (!query) return items;
      return items.filter(item => Object.values(item).some(value => String(value).toLocaleLowerCase("it").includes(query)));
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function dateFromISO(value) {
      if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? date : null;
    }

    function dayOffsetForISO(value) {
      const date = dateFromISO(value);
      if (!date) return null;
      const todayUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
      const dateUTC = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
      return Math.round((dateUTC - todayUTC) / 86_400_000);
    }

    function subjectColor(subject) {
      const existingColor = assignments.find(item => item.subject === subject && item.color)?.color;
      if (existingColor) return existingColor;
      const normalized = subject.toLocaleLowerCase("it");
      if (normalized.includes("mate")) return "#e84fd5";
      if (normalized.includes("fisica") || normalized.includes("scienz")) return "#f45d62";
      if (normalized.includes("storia")) return "#20b88e";
      if (normalized.includes("ingles") || normalized.includes("lingua")) return "#2878ef";
      if (normalized.includes("arte") || normalized.includes("disegno")) return "#f5ad16";
      return "#8050ed";
    }

    function createLocalAssignment(task) {
      const date = dateFromISO(task.due);
      const dayOffset = dayOffsetForISO(task.due);
      return {
        id: task.id,
        subject: task.subject,
        title: task.title,
        detail: task.detail || "",
        due: date ? new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" }).format(date) : "",
        dueISO: task.due,
        dayOffset,
        color: subjectColor(task.subject),
        priority: task.priority || "media",
        source: "local"
      };
    }

    function prepareArgoData(result) {
      if (!result || !Array.isArray(result.assignments) || !Array.isArray(result.reminders)) {
        throw new Error("Argo ha restituito dati in un formato non valido.");
      }
      const colors = ["#3282e8", "#f05262", "#29bd8e", "#ffb900", "#8b5ce7"];
      const importedAssignments = result.assignments.flatMap((item, index) => {
        const dayOffset = item && dayOffsetForISO(item.due);
        if (dayOffset === null || typeof item.title !== "string" || !item.title.trim()) return [];
        return [{
          id: `argo-task-${index}-${item.due}`,
          subject: typeof item.subject === "string" && item.subject.trim() ? item.subject.trim().slice(0, 120) : "Materia",
          title: item.title.trim().slice(0, 1000),
          detail: "",
          due: new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" }).format(dateFromISO(item.due)),
          dueISO: item.due,
          dayOffset,
          color: colors[index % colors.length],
        }];
      });
      const importedReminders = result.reminders.flatMap((item, index) => {
        const dateOffset = item && dayOffsetForISO(item.date);
        if (dateOffset === null || typeof item.title !== "string" || !item.title.trim()) return [];
        return [{
          id: `argo-reminder-${index}-${item.date}`,
          date: item.date,
          dateOffset,
          time: typeof item.time === "string" ? item.time.slice(0, 5) : "",
          title: item.title.trim().slice(0, 1000),
          detail: typeof item.detail === "string" ? item.detail.trim().slice(0, 500) : "",

    function resizeProfileImage(file, maxWidth, maxHeight) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) {
          reject(new Error("Scegli un file immagine valido."));
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          reject(new Error("L'immagine supera il limite di 10 MB."));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Non è stato possibile leggere l'immagine."));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error("Il file selezionato non è un'immagine valida."));
          image.onload = () => {
            const scale = Math.min(maxWidth / image.width, maxHeight / image.height, 1);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            const context = canvas.getContext("2d");
            if (!context) {
              reject(new Error("Il browser non può elaborare questa immagine."));
              return;
            }
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          image.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
    }

    function dateGroupLabel(dayOffset) {
      const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() + dayOffset);
      const dateText = new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long" }).format(date);
      const relativeDay = dayOffset === 0 ? "Oggi" : dayOffset === 1 ? "Domani" : "";
      return { relativeDay, dateText };
    }

    function groupedByDay(items, offsetKey, renderItem, summarizeGroup = null) {
      const groups = new Map();
      items.forEach(item => {
        if (!groups.has(item[offsetKey])) groups.set(item[offsetKey], []);
        groups.get(item[offsetKey]).push(item);
      });
      return [...groups.entries()]
        .sort(([firstDay], [secondDay]) => firstDay - secondDay)
        .map(([dayOffset, groupItems]) => {
          const { relativeDay, dateText } = dateGroupLabel(dayOffset);
          const summary = summarizeGroup ? summarizeGroup(groupItems) : "";
          return `<section class="day-group"><h3 class="day-group-title">${relativeDay ? `${relativeDay} · ` : ""}<span class="day-group-date">${escapeHTML(dateText)}</span>${summary}</h3><div class="day-group-items">${groupItems.map(renderItem).join("")}</div></section>`;
        }).join("");
    }

    function taskProgress(items) {
      const remaining = items.filter(item => !taskIsComplete(item)).length;
      const message = remaining === 0
        ? "Tutti i compiti sono stati completati"
        : remaining === 1 ? "Ti manca 1 compito" : `Ti mancano ${remaining} compiti`;
      return `<span class="day-group-progress ${remaining === 0 ? "is-complete" : ""}">${message}</span>`;

    }

    function calendarMarkup() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const previousDays = new Date(year, month, 0).getDate();
      let days = "";
      for (let index = 0; index < 42; index += 1) {
        let day;
        let outside = false;
        let cellMonth = month;
        let cellYear = year;
        if (index < firstWeekday) {
          day = previousDays - firstWeekday + index + 1;
          outside = true;
          if (month === 0) { cellMonth = 11; cellYear -= 1; } else cellMonth -= 1;
        } else if (index >= firstWeekday + daysInMonth) {
          day = index - firstWeekday - daysInMonth + 1;
          outside = true;
          if (month === 11) { cellMonth = 0; cellYear += 1; } else cellMonth += 1;
        } else {
          day = index - firstWeekday + 1;
        }
        const isToday = !outside && year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
        const cellDate = new Date(cellYear, cellMonth, day);
        const cellISO = `${cellYear}-${String(cellMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const isTaskCalendar = currentPage === "Compiti";
        const isReminderCalendar = currentPage === "Promemoria";
        const calendarSelection = isTaskCalendar ? taskSelectedDate : isReminderCalendar ? reminderSelectedDate : "";
        const isSelected = !outside && (isTaskCalendar || isReminderCalendar ? Boolean(calendarSelection) && calendarSelection === cellISO : day === selectedDay);
        const hasItems = isReminderCalendar
          ? reminders.some(item => item.date === cellISO)
          : assignments.some(item => item.dueISO === cellISO || (item.dueISO == null && item.dayOffset === dayOffsetForISO(cellISO)));
        const itemLabel = isReminderCalendar ? "promemoria" : "compiti";
        days += `<button class="calendar-day ${outside ? "outside" : ""} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""} ${hasItems ? "has-tasks" : ""}" data-day="${day}" data-month="${cellMonth}" data-year="${cellYear}" aria-label="${new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" }).format(cellDate)}${hasItems ? `, con ${itemLabel}` : ""}">${day}</button>`;
      }
      return `<div class="calendar-grid" role="grid">${["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"].map(day => `<span class="weekday" role="columnheader">${day}</span>`).join("")}${days}</div>`;
    }

    function homeCalendarMarkup() {

      const weekStart = new Date(year, month, selectedDay - mondayOffset);

        const isToday = date.toDateString() === today.toDateString();
        const isSelected = date.toDateString() === selectedDate.toDateString();
        return `<button class="calendar-day ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}" data-day="${date.getDate()}" data-month="${date.getMonth()}" data-year="${date.getFullYear()}" aria-label="${new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(date)}"><span class="home-weekday">${new Intl.DateTimeFormat("it-IT", { weekday: "short" }).format(date)}</span><span>${date.getDate()}</span></button>`;

        <div class="home-shortcuts" aria-label="Collegamenti rapidi">
          <button type="button" class="shortcut shortcut-green" data-go="Compiti"><span class="shortcut-icon">＋</span><span><strong>Gestisci compiti</strong><small>Consulta le consegne</small></span></button>
          <button type="button" class="shortcut shortcut-pink" data-go="Promemoria"><span class="shortcut-icon">♧</span><span><strong>Promemoria</strong><small>Non dimenticare nulla</small></span></button>
          <button type="button" class="shortcut shortcut-purple" data-go="Calendario"><span class="shortcut-icon">▦</span><span><strong>Visualizza calendario</strong><small>I tuoi impegni in un'unica vista</small></span></button>

    }

    function taskPriority(item) {
      if (["alta", "media", "bassa"].includes(item.priority)) return item.priority;
      if (item.dayOffset <= 1 || /verifica|interrogazione|esame/i.test(`${item.title} ${item.detail}`)) return "alta";
      if (item.dayOffset >= 7) return "bassa";
      return "media";
    }

    function taskPageCard(item) {
      const isDone = taskIsComplete(item);
      const priority = taskPriority(item);
      const dueDate = dateFromISO(item.dueISO);
      const dueLabel = item.dayOffset === 0 ? "Oggi" : item.dayOffset === 1 ? "Domani" : item.due;
      return `<article class="task-page-card ${isDone ? "is-done" : ""}">
        <button class="check-button task-page-check" type="button" data-complete="${escapeHTML(item.id)}" aria-label="${isDone ? "Segna da fare" : "Segna come completato"}" aria-pressed="${isDone}">${isDone ? "✓" : "○"}</button>
        <span class="subject-dot" style="background:${item.color}"></span>
        <div class="task-page-card-body"><div class="task-page-card-meta"><span class="subject">${escapeHTML(item.subject)}</span><span class="task-priority priority-${priority}"><i></i>${priority === "alta" ? "Alta" : priority === "bassa" ? "Bassa" : "Media"}</span></div>
          <h3 class="assignment-title">${escapeHTML(item.title)}</h3><p class="assignment-detail">${escapeHTML(item.detail || "Nessuna descrizione aggiuntiva.")}</p>
        </div><span class="task-page-due ${item.dayOffset <= 1 ? "urgent" : ""}"><small>Scadenza</small><strong>${escapeHTML(dueLabel)}</strong>${dueDate ? `<span>${escapeHTML(new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short" }).format(dueDate))}</span>` : ""}</span>
      </article>`;
    }

    function taskDayGroups(items) {
      const groups = new Map();
      items.forEach(item => {
        if (!groups.has(item.dayOffset)) groups.set(item.dayOffset, []);
        groups.get(item.dayOffset).push(item);
      });
      return [...groups.entries()].sort(([a], [b]) => a - b).map(([dayOffset, groupItems]) => {
        const { relativeDay, dateText } = dateGroupLabel(dayOffset);
        const key = String(dayOffset);
        const collapsed = collapsedTaskGroups.has(key);
        const completeCount = groupItems.filter(taskIsComplete).length;
        return `<section class="task-day-group">
          <button type="button" class="task-day-heading" data-task-group="${key}" aria-expanded="${!collapsed}">
            <span class="task-day-chevron">${collapsed ? "›" : "⌄"}</span><strong>${relativeDay || escapeHTML(dateText)}</strong>
            <span class="task-day-count">${groupItems.length} ${groupItems.length === 1 ? "compito" : "compiti"}</span>
            <span class="task-day-progress">${completeCount}/${groupItems.length} completati</span>
          </button>
          ${collapsed ? "" : `<div class="task-day-items ${taskViewMode === "grid" ? "is-grid" : ""}">${groupItems.map(taskPageCard).join("")}</div>`}
        </section>`;
      }).join("");
    }

    function tasksPage() {
      const upcoming = assignments.filter(item => item.dayOffset >= 0);
      const searched = filtered(upcoming);
      const stats = {
        total: searched.length,
        completed: searched.filter(taskIsComplete).length,
        open: searched.filter(item => !taskIsComplete(item)).length,
        due: searched.filter(item => item.dayOffset === 0 && !taskIsComplete(item)).length
      };
      const subjects = [...new Set(upcoming.map(item => item.subject))].sort((a, b) => a.localeCompare(b, "it"));
      let tasks = searched.filter(item => {
        const complete = taskIsComplete(item);
        const statusMatch = taskStatusFilter === "all"
          || (taskStatusFilter === "open" && !complete)
          || (taskStatusFilter === "completed" && complete)
          || (taskStatusFilter === "due" && !complete && item.dayOffset <= 2);
        const subjectMatch = !taskSubjectFilter || item.subject === taskSubjectFilter;
        const dateMatch = !taskSelectedDate || item.dueISO === taskSelectedDate
          || (!item.dueISO && item.dayOffset === dayOffsetForISO(taskSelectedDate));
        return statusMatch && subjectMatch && dateMatch;
      });
      tasks = tasks.sort((a, b) => taskSortOrder === "subject"
        ? a.subject.localeCompare(b.subject, "it") || a.dayOffset - b.dayOffset
        : taskSortOrder === "priority"
          ? ({ alta: 0, media: 1, bassa: 2 }[taskPriority(a)] - { alta: 0, media: 1, bassa: 2 }[taskPriority(b)]) || a.dayOffset - b.dayOffset
          : a.dayOffset - b.dayOffset || a.subject.localeCompare(b.subject, "it"));
      const selectedDate = taskSelectedDate ? dateFromISO(taskSelectedDate) : null;
      const taskHeading = selectedDate
        ? `Compiti · ${new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long" }).format(selectedDate)}`
        : "Tutti i compiti";
      const filterTabs = [
        ["all", "Tutti"],
        ["open", "Da svolgere"],
        ["completed", "Completati"],
        ["due", "In scadenza"]
      ];
      const subjectCounts = subjects.map(subject => {
        const count = upcoming.filter(item => item.subject === subject && !taskIsComplete(item)).length;
        return `<button type="button" class="task-subject-item ${taskSubjectFilter === subject ? "is-active" : ""}" data-task-subject="${escapeHTML(subject)}" aria-pressed="${taskSubjectFilter === subject}"><span class="subject-dot" style="background:${subjectColor(subject)}"></span><span>${escapeHTML(subject)}</span><strong>${count}</strong></button>`;
      }).join("");
      const dueSoon = upcoming.filter(item => !taskIsComplete(item) && item.dayOffset <= 7).length;
      const completionPercent = upcoming.length ? Math.round(upcoming.filter(taskIsComplete).length / upcoming.length * 100) : 0;
      return `${header("I tuoi compiti", "Organizza le consegne e tieni sotto controllo i tuoi progressi.")}
        <div class="task-page page-enter">
          <div class="task-page-header"><div><span class="task-page-eyebrow">IL TUO SPAZIO DI STUDIO</span><h2>Ogni passo ti avvicina al traguardo.</h2><p>Un compito alla volta: ce la puoi fare!</p></div><button type="button" class="task-add-button" data-add-task><span>＋</span> Aggiungi compito</button></div>
          <section class="task-stats" aria-label="Riepilogo compiti">
            <article class="task-stat"><span class="task-stat-icon all">▤</span><div><strong>${stats.total}</strong><span>Compiti totali</span></div><small>In programma</small></article>
            <article class="task-stat"><span class="task-stat-icon done">✓</span><div><strong>${stats.completed}</strong><span>Completati</span></div><small>Ottimo lavoro!</small></article>
            <article class="task-stat"><span class="task-stat-icon open">◷</span><div><strong>${stats.open}</strong><span>Da svolgere</span></div><small>Ancora da fare</small></article>
            <article class="task-stat"><span class="task-stat-icon due">⌛</span><div><strong>${stats.due}</strong><span>In scadenza oggi</span></div><small>Organizzati per tempo</small></article>
          </section>
          <div class="task-workspace">
            <section class="card task-main-panel">
              <div class="task-toolbar"><div class="task-filter-tabs" role="group" aria-label="Filtra compiti">${filterTabs.map(([key, label]) => `<button type="button" data-task-filter="${key}" class="${taskStatusFilter === key ? "is-active" : ""}" aria-pressed="${taskStatusFilter === key}">${label}${key === "due" ? `<span>${upcoming.filter(item => !taskIsComplete(item) && item.dayOffset <= 2).length}</span>` : ""}</button>`).join("")}</div>
                <div class="task-view-actions"><label class="task-sort-label" for="task-sort">Ordina per</label><select id="task-sort" class="task-sort"><option value="due" ${taskSortOrder === "due" ? "selected" : ""}>Scadenza</option><option value="subject" ${taskSortOrder === "subject" ? "selected" : ""}>Materia</option><option value="priority" ${taskSortOrder === "priority" ? "selected" : ""}>Priorità</option></select>
                  <div class="task-view-toggle" role="group" aria-label="Vista compiti"><button type="button" data-task-view="list" class="${taskViewMode === "list" ? "is-active" : ""}" aria-label="Vista elenco" aria-pressed="${taskViewMode === "list"}">☰</button><button type="button" data-task-view="grid" class="${taskViewMode === "grid" ? "is-active" : ""}" aria-label="Vista griglia" aria-pressed="${taskViewMode === "grid"}">▦</button></div>
                </div>
              </div>
              <div class="task-list-heading"><div><h2>${escapeHTML(taskHeading)}</h2><p>${tasks.length} ${tasks.length === 1 ? "compito visualizzato" : "compiti visualizzati"}</p></div>${taskSubjectFilter || taskSelectedDate ? `<button type="button" class="task-clear-filters" data-clear-task-filters>Rimuovi filtri <span>×</span></button>` : ""}</div>
              <div class="task-day-groups">${tasks.length ? taskDayGroups(tasks) : empty("Nessun compito corrisponde ai filtri selezionati.")}</div>
            </section>
            <aside class="task-side-column">
              <section class="card task-side-panel"><div class="task-side-heading"><h2><span>▦</span> Calendario</h2><button type="button" data-clear-task-date aria-label="Mostra tutte le date">Tutti</button></div>${calendarControls()}${calendarMarkup()}<p class="task-calendar-note">${taskSelectedDate ? `Filtro: ${escapeHTML(new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long" }).format(selectedDate))}` : "Seleziona un giorno per filtrare i compiti."}</p></section>
              <section class="card task-side-panel"><div class="task-side-heading"><h2><span class="task-subject-heading-icon">▥</span> Materie</h2><span class="task-side-caption">Da svolgere</span></div><div class="task-subject-list">${subjectCounts || empty("Le materie appariranno qui.")}</div>${taskSubjectFilter ? `<button type="button" class="task-reset-subject" data-clear-task-subject>Mostra tutte le materie</button>` : ""}</section>
              <section class="card task-progress-panel"><div class="task-progress-heading"><span>✦</span><div><strong>La tua settimana</strong><small>Un piccolo passo ogni giorno</small></div></div><div class="task-progress-count"><strong>${dueSoon}</strong><span>compiti nei prossimi 7 giorni</span></div><div class="task-progress-track"><span style="width:${completionPercent}%"></span></div><p>${completionPercent}% completato</p><button type="button" data-open-planning>✦ Pianifica con AI <span>→</span></button></section>
            </aside>
          </div>
          <p class="disclaimer">${assignments.some(item => item.source === "local") ? "I compiti aggiunti manualmente sono salvati su questo dispositivo. " : ""}Dati importati da Argo${argoImportedAt ? ` · aggiornati il ${escapeHTML(new Intl.DateTimeFormat("it-IT", { dateStyle: "short", timeStyle: "short" }).format(new Date(argoImportedAt)))}` : ""}</p>
          <dialog class="task-dialog" id="task-dialog"><form id="task-form"><div class="task-dialog-heading"><div><span class="task-page-eyebrow">NUOVA CONSEGNA</span><h2>Aggiungi un compito</h2></div><button type="button" class="task-dialog-close" data-close-task aria-label="Chiudi">×</button></div>
            <label class="task-form-field">Materia<input name="subject" maxlength="60" list="task-subject-options" placeholder="es. Matematica" required><datalist id="task-subject-options">${subjects.map(subject => `<option value="${escapeHTML(subject)}">`).join("")}</datalist></label>
            <label class="task-form-field">Titolo<input name="title" maxlength="140" placeholder="es. Esercizi pagina 42" required></label>
            <label class="task-form-field">Descrizione<textarea name="detail" maxlength="500" rows="3" placeholder="Aggiungi dettagli (facoltativo)"></textarea></label>
            <div class="task-form-row"><label class="task-form-field">Scadenza<input name="due" type="date" min="${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}" value="${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}" required></label><label class="task-form-field">Priorità<select name="priority"><option value="media">Media</option><option value="alta">Alta</option><option value="bassa">Bassa</option></select></label></div>
            <p class="task-form-error" id="task-form-error" role="alert"></p><div class="task-dialog-actions"><button type="button" class="task-cancel-button" data-close-task>Annulla</button><button type="submit" class="task-add-button">Salva compito</button></div>
          </form></dialog>
        </div>`;
    }

    function previousTasksPage() {
      const tasks = filtered(assignments.filter(item => item.dayOffset < 0));
      return taskListPage("Compiti passati", "Consulta le consegne dei giorni precedenti.", tasks, "Non ci sono compiti dei giorni precedenti.");
    }

    function taskListPage(title, subtitle, tasks, emptyMessage) {
      return `${header(title, subtitle)}
        <section class="card panel page-enter">${sectionHeading(title, "▤", "Home", "Home")}
        ${tasks.length ? groupedByDay(tasks, "dayOffset", item => {
          const isDone = taskIsComplete(item);
          return `<article class="task-row ${isDone ? "is-done" : ""}">
            <button class="check-button" data-complete="${escapeHTML(item.id)}" aria-label="${isDone ? "Segna da fare" : "Segna come completato"}" aria-pressed="${isDone}">${isDone ? "✓" : "○"}</button>
            <span class="subject-dot" style="background:${item.color}"></span>
            <div class="assignment-body"><span class="subject">${escapeHTML(item.subject)}</span><h3 class="assignment-title">${escapeHTML(item.title)}</h3><p class="assignment-detail">${escapeHTML(item.detail)}</p></div>
          </article>`;
        }, taskProgress) : empty(emptyMessage)}</section>
        <p class="disclaimer">Dati importati da Argo${argoImportedAt ? ` · aggiornati il ${escapeHTML(new Intl.DateTimeFormat("it-IT", { dateStyle: "short", timeStyle: "short" }).format(new Date(argoImportedAt)))}` : ""}</p>`;
    }

    function reminderPageCard(item) {
      const date = dateFromISO(item.date);
      const dateLabel = item.dateOffset === 0 ? "Oggi" : item.dateOffset === 1 ? "Domani" : date
        ? new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short" }).format(date)
        : item.date;
      return `<article class="task-page-card reminder-page-card">
        <span class="subject-dot" style="background:${item.color || "#8b5ce7"}"></span>
        <div class="task-page-card-body"><div class="task-page-card-meta"><span class="reminder-page-label">Promemoria</span></div>
          <h3 class="assignment-title">${escapeHTML(item.title)}</h3><p class="assignment-detail">${escapeHTML(item.detail || "Nessun dettaglio aggiuntivo.")}</p>
        </div><span class="task-page-due ${item.dateOffset <= 1 ? "urgent" : ""}"><small>Data e ora</small><strong>${escapeHTML(dateLabel)}</strong><span>${escapeHTML(item.time || "Orario non indicato")}</span></span>
      </article>`;
    }

    function reminderDayGroups(items) {
      const groups = new Map();
      items.forEach(item => {
        if (!groups.has(item.dateOffset)) groups.set(item.dateOffset, []);
        groups.get(item.dateOffset).push(item);
      });
      return [...groups.entries()].sort(([a], [b]) => a - b).map(([dateOffset, groupItems]) => {
        const { relativeDay, dateText } = dateGroupLabel(dateOffset);
        const key = `reminder-${dateOffset}`;
        const collapsed = collapsedTaskGroups.has(key);
        return `<section class="task-day-group">
          <button type="button" class="task-day-heading" data-reminder-group="${key}" aria-expanded="${!collapsed}">
            <span class="task-day-chevron">${collapsed ? "›" : "⌄"}</span><strong>${relativeDay || escapeHTML(dateText)}</strong>
            <span class="task-day-count">${groupItems.length} ${groupItems.length === 1 ? "promemoria" : "promemoria"}</span>
            <span class="task-day-progress">${groupItems.length} in programma</span>
          </button>
          ${collapsed ? "" : `<div class="task-day-items ${reminderViewMode === "grid" ? "is-grid" : ""}">${groupItems.map(reminderPageCard).join("")}</div>`}
        </section>`;
      }).join("");
    }

    function remindersPage() {
      const upcoming = reminders.filter(item => item.dateOffset >= 0);
      const searched = filtered(upcoming);
      const stats = {
        total: searched.length,
        today: searched.filter(item => item.dateOffset === 0).length,
        nextThreeDays: searched.filter(item => item.dateOffset >= 0 && item.dateOffset <= 2).length,
        later: searched.filter(item => item.dateOffset > 2).length
      };
      const filters = [["all", "Tutti"], ["today", "Oggi"], ["three-days", "Prossimi 3 giorni"], ["later", "Più avanti"]];
      let items = searched.filter(item => {
        const matchesFilter = reminderFilter === "all"
          || (reminderFilter === "today" && item.dateOffset === 0)
          || (reminderFilter === "three-days" && item.dateOffset >= 0 && item.dateOffset <= 2)
          || (reminderFilter === "later" && item.dateOffset > 2);
        return matchesFilter && (!reminderSelectedDate || item.date === reminderSelectedDate);
      });
      items = items.sort((a, b) => reminderSortOrder === "title"
        ? a.title.localeCompare(b.title, "it") || a.dateOffset - b.dateOffset
        : reminderSortOrder === "time"
          ? a.dateOffset - b.dateOffset || (a.time || "").localeCompare(b.time || "")
          : a.dateOffset - b.dateOffset || (a.time || "").localeCompare(b.time || ""));
      const selectedDate = reminderSelectedDate ? dateFromISO(reminderSelectedDate) : null;
      const listHeading = selectedDate
        ? `Promemoria · ${new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long" }).format(selectedDate)}`
        : reminderFilter === "today" ? "Promemoria di oggi"
          : reminderFilter === "three-days" ? "Prossimi 3 giorni"
            : reminderFilter === "later" ? "Più avanti" : "Tutti i promemoria";
      const upcomingWeek = upcoming.filter(item => item.dateOffset <= 7).length;
      const totalDays = upcoming.length ? new Set(upcoming.map(item => item.date)).size : 0;
      const byTime = [
        ["Mattina", upcoming.filter(item => Number((item.time || "12:00").slice(0, 2)) < 12).length],
        ["Pomeriggio", upcoming.filter(item => { const hour = Number((item.time || "12:00").slice(0, 2)); return hour >= 12 && hour < 18; }).length],
        ["Sera", upcoming.filter(item => Number((item.time || "12:00").slice(0, 2)) >= 18).length]
      ];
      return `${header("Promemoria", "Tieni sotto controllo verifiche, scadenze e cose da ricordare.")}
        <div class="task-page reminder-page page-enter">
          <div class="task-page-header reminder-page-header"><div><span class="task-page-eyebrow">I TUOI IMPEGNI</span><h2>Le cose importanti, al momento giusto.</h2><p>Organizza le scadenze e non dimenticare nulla.</p></div><button type="button" class="task-add-button" data-add-reminder><span>＋</span> Aggiungi promemoria</button></div>
          <section class="task-stats reminder-stats" aria-label="Riepilogo promemoria">
            <article class="task-stat"><span class="task-stat-icon all">♟</span><div><strong>${stats.total}</strong><span>Promemoria totali</span></div><small>In programma</small></article>
            <article class="task-stat"><span class="task-stat-icon due">◷</span><div><strong>${stats.today}</strong><span>Oggi</span></div><small>Da ricordare oggi</small></article>
            <article class="task-stat"><span class="task-stat-icon open">▦</span><div><strong>${stats.nextThreeDays}</strong><span>Prossimi 3 giorni</span></div><small>Oggi, domani e dopodomani</small></article>
            <article class="task-stat"><span class="task-stat-icon done">→</span><div><strong>${stats.later}</strong><span>Più avanti</span></div><small>Le prossime scadenze</small></article>
          </section>
          <div class="task-workspace">
            <section class="card task-main-panel">
              <div class="task-toolbar"><div class="task-filter-tabs reminder-filter-tabs" role="group" aria-label="Filtra promemoria">${filters.map(([key, label]) => `<button type="button" data-reminder-filter="${key}" class="${reminderFilter === key ? "is-active" : ""}" aria-pressed="${reminderFilter === key}">${label}${key === "today" ? `<span>${stats.today}</span>` : ""}</button>`).join("")}</div>
                <div class="task-view-actions"><label class="task-sort-label" for="reminder-sort">Ordina per</label><select id="reminder-sort" class="task-sort"><option value="date" ${reminderSortOrder === "date" ? "selected" : ""}>Data</option><option value="time" ${reminderSortOrder === "time" ? "selected" : ""}>Orario</option><option value="title" ${reminderSortOrder === "title" ? "selected" : ""}>Titolo</option></select><div class="task-view-toggle" role="group" aria-label="Vista promemoria"><button type="button" data-reminder-view="list" class="${reminderViewMode === "list" ? "is-active" : ""}" aria-label="Vista elenco" aria-pressed="${reminderViewMode === "list"}">☰</button><button type="button" data-reminder-view="grid" class="${reminderViewMode === "grid" ? "is-active" : ""}" aria-label="Vista griglia" aria-pressed="${reminderViewMode === "grid"}">▦</button></div></div>
              </div>
              <div class="task-list-heading"><div><h2>${escapeHTML(listHeading)}</h2><p>${items.length} ${items.length === 1 ? "promemoria visualizzato" : "promemoria visualizzati"}</p></div>${reminderSelectedDate ? `<button type="button" class="task-clear-filters" data-clear-reminder-filters>Rimuovi filtro <span>×</span></button>` : ""}</div>
              <div class="task-day-groups">${items.length ? reminderDayGroups(items) : empty("Nessun promemoria corrisponde ai filtri selezionati.")}</div>
            </section>
            <aside class="task-side-column">
              <section class="card task-side-panel"><div class="task-side-heading"><h2><span>▦</span> Calendario</h2><button type="button" data-clear-reminder-date aria-label="Mostra tutte le date">Tutti</button></div>${calendarControls()}${calendarMarkup()}<p class="task-calendar-note">${reminderSelectedDate ? `Filtro: ${escapeHTML(new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long" }).format(selectedDate))}` : "Seleziona un giorno per filtrare i promemoria."}</p></section>
              <section class="card task-side-panel"><div class="task-side-heading"><h2><span class="task-subject-heading-icon">◷</span> Distribuzione</h2><span class="task-side-caption">Per fascia oraria</span></div><div class="reminder-time-breakdown">${byTime.map(([label, count]) => `<div><span>${label}</span><strong>${count}</strong><i><b style="width:${upcoming.length ? count / upcoming.length * 100 : 0}%"></b></i></div>`).join("")}</div></section>
              <section class="card task-progress-panel reminder-progress-panel"><div class="task-progress-heading"><span>♟</span><div><strong>Promemoria vicini</strong><small>Per i prossimi giorni</small></div></div><div class="task-progress-count"><strong>${upcomingWeek}</strong><span>nei prossimi 7 giorni</span></div><div class="task-progress-track"><span style="width:${totalDays ? Math.min(100, upcomingWeek / Math.max(1, totalDays) * 100) : 0}%"></span></div><p>${totalDays} ${totalDays === 1 ? "giorno" : "giorni"} con impegni</p><button type="button" data-reminder-filter="three-days">Vedi i prossimi 3 giorni <span>→</span></button></section>

    async function generateStudyPlan() {
      if (!geminiApiConfigured || planningBusy) return;
      planningBusy = true;
      planningStatus = "Sto preparando un piano realistico…";
      render();
      const planningData = {
        today: new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(today),
        schoolYear: account.schoolYear || "non indicato",
        tasks: assignments
          .filter(item => !taskIsComplete(item))
          .map(item => ({
            subject: item.subject,
            title: item.title,
            details: item.detail,
            dueDate: dateGroupLabel(item.dayOffset).dateText,
            daysUntilDue: item.dayOffset
          })),
        reminders: reminders
          .filter(item => item.dateOffset >= 0)
          .map(item => ({
            title: item.title,
            details: item.detail,
            date: dateGroupLabel(item.dateOffset).dateText,
            daysUntil: item.dateOffset,
            time: item.time
          }))
      };
      try {
        planningResult = await askGemini([{
          role: "user",
          parts: [{ text: `Crea il mio piano di studio usando tutti i compiti non completati e tutti i promemoria futuri nei dati seguenti. Oggi è ${planningData.today}. Considera l'anno scolastico solo come contesto per calibrare il linguaggio, non come fonte di compiti.\n\nDATI DEL DIARIO:\n${JSON.stringify(planningData, null, 2)}` }]
        }], `Sei un tutor scolastico esperto di pianificazione. Analizza davvero ogni compito e promemoria fornito e restituisci in italiano un piano pratico, personalizzato e ordinato per data. I dati del diario sono l'unica fonte attendibile: non aggiungere impegni e non ignorare elementi. L'anno scolastico, se presente, serve soltanto a calibrare il livello delle spiegazioni.

Prima di pianificare:
- tratta verifiche, interrogazioni, test ed esami come prove da preparare nei giorni precedenti, non come normali promemoria;
- valuta difficoltà e impegno di ogni compito e prova (facile, medio o impegnativo), motivando brevemente la stima in base alla materia, alla quantità e ai dettagli disponibili; segnalala sempre come stima, non come dato certo;
- individua i carichi quantificabili: conta esercizi elencati (per esempio n. 1, 2, 3 = 3 esercizi), ricava il numero di pagine solo da pagine o intervalli esplicitamente indicati e conta gli intervalli di paragrafi solo se inequivocabili.

Poi pianifica da oggi fino all'ultima scadenza, con una sezione per ciascun giorno in cui è utile studiare:
- evidenzia data, prove imminenti e scadenze, indicando anche l'ora dei promemoria quando presente;
- assegna ogni compito a una giornata prima della sua scadenza, specificando materia, attività e numero di esercizi quando ricavabile;
- distribuisci la preparazione di ciascuna verifica su più sessioni brevi nei giorni disponibili; per ogni sessione indica pagine, esercizi o argomenti e quantità solo quando supportati dai dati, con un obiettivo diverso e progressivo (comprensione, ripasso, richiamo attivo);
- stima la durata di ogni sessione e il carico giornaliero in modo realistico, alterna attività impegnative e leggere e inserisci pause; non presumere quante ore libere abbia lo studente e non sovraccaricare la vigilia;
- chiudi ogni giornata con una breve lista di controllo e termina con le informazioni che mancano per rendere il piano più preciso.

    async function sendChatMessage() {
      if (!geminiApiConfigured || chatBusy) return;
      const input = document.querySelector("#chat-input");
      const message = input.value.trim();
      if (!message) return;
      chatHistory.push({ role: "user", text: message });
      chatStatus = "";
      chatBusy = true;
      render();
      const conversation = chatHistory.map(item => ({
        role: item.role,
        parts: [{ text: item.text }]
      }));
      try {
        const answer = await askGemini(conversation, "Sei un assistente scolastico amichevole. Rispondi in italiano, in modo chiaro e adatto a uno studente. Aiuta con compiti e organizzazione senza inventare dati del registro.");
        chatHistory.push({ role: "model", text: answer });
      } catch (error) {
        chatHistory.pop();
        chatStatus = `Errore: ${error.message}`;
      } finally {
        chatBusy = false;
        if (currentPage === "Chat") render();
      }
    }

    async function askGemini(contents, systemInstruction) {
      if (!account.preferences.aiPlanning) throw new Error("Hai disattivato l'IA per la pianificazione nelle preferenze del profilo.");
      if (!geminiApiConfigured) throw new Error("Gemini non è configurato sul server.");
      const response = await fetch("/api/gemini", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
        body: JSON.stringify({
          model: API_CONFIG.google.models["gemini-2.5-chat"],
          systemInstruction,
          contents
        })
      });
      const result = await response.json();
      if (!response.ok) {
        if (response.status === 401 || response.status === 403) await refreshAppConfig();
        const message = result?.error || `La richiesta a Gemini non è riuscita (HTTP ${response.status}).`;
        throw new Error(message);
      }
      const text = typeof result?.text === "string" ? result.text.trim() : "";
      if (!text) throw new Error("Gemini ha restituito una risposta vuota. Riprova.");
      return text;
    }

    async function refreshAppConfig() {
      const authGate = document.querySelector("#auth-gate");
      const appElement = document.querySelector(".app");
      const form = document.querySelector("#auth-form");
      const authStatus = document.querySelector("#auth-status");
      try {
        const response = await fetch("/api/config", { cache: "no-store" });
        const config = await response.json();
        if (!response.ok) throw new Error(config?.error || `Errore HTTP ${response.status}.`);
        csrfToken = config.csrfToken || "";
        localAuthBypass = config.localAuthBypass === true;
        geminiApiConfigured = config.configured === true;
        geminiConfigError = "";
        if (config.setupRequired) {
          appElement.hidden = true;
          authGate.hidden = false;
          document.querySelector("#auth-title").textContent = "Configurazione necessaria";
          document.querySelector("#auth-copy").textContent = "Prima della pubblicazione, imposta SESSION_SECRET, APP_PASSWORD e GEMINI_API_KEY nelle variabili segrete dell'hosting.";
          form.hidden = true;
          authStatus.textContent = "";
          return;
        }
        if (!config.authenticated) {
          wasAuthenticated = false;
          appElement.hidden = true;
          authGate.hidden = false;
          document.querySelector("#auth-title").textContent = "Diario scolastico";
          document.querySelector("#auth-copy").textContent = "Accedi per aprire il diario e usare l'assistente AI.";
          form.hidden = false;
          authStatus.textContent = "";
          document.querySelector("#app-password").focus();
          return;
        }
        if (!wasAuthenticated) {
          wasAuthenticated = true;
          returnToAccountAfterArgo = true;
          currentPage = "Account";
          aiMode = false;
        }
        authGate.hidden = true;
        appElement.hidden = false;
        geminiConfigLoaded = true;
        render();
      } catch (error) {
        appElement.hidden = true;
        authGate.hidden = false;
        document.querySelector("#auth-title").textContent = "Sito non raggiungibile";
        document.querySelector("#auth-copy").textContent = "Controlla la connessione e riprova. Per l'accesso da telefono e PC, il progetto deve essere pubblicato su un hosting HTTPS.";
        form.hidden = true;
        authStatus.textContent = error.message;
        console.error("Non è stato possibile verificare la configurazione dell'app.", error);
      } finally {
        geminiConfigLoaded = true;
      }
    }

    async function login() {
      const form = document.querySelector("#auth-form");
      const passwordInput = document.querySelector("#app-password");
      const submitButton = form.querySelector("button[type='submit']");
      const status = document.querySelector("#auth-status");
      submitButton.disabled = true;
      status.textContent = "";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
          body: JSON.stringify({ password: passwordInput.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result?.error || `Accesso non riuscito (HTTP ${response.status}).`);
        passwordInput.value = "";
        await refreshAppConfig();
      } catch (error) {
        status.textContent = error.message;
        passwordInput.focus();
      } finally {
        submitButton.disabled = false;
      }
    }

    async function logout() {
      try {
        const response = await fetch("/api/logout", {
          method: "POST",
          headers: { "X-CSRF-Token": csrfToken }
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result?.error || `Uscita non riuscita (HTTP ${response.status}).`);
        csrfToken = "";
        await refreshAppConfig();
      } catch (error) {
        chatStatus = `Errore: ${error.message}`;
        console.error("Non è stato possibile chiudere la sessione.", error);
      }
    }

    async function syncArgo(form) {
      const submitButton = form.querySelector("button[type='submit']");
      const status = form.querySelector("#argo-status");
      const wasConnected = argoConnected;
      const formData = new FormData(form);
      submitButton.disabled = true;
      status.textContent = "Connessione ad Argo e importazione in corso…";
      status.classList.remove("error");
      argoSyncFailed = false;
      try {
        const response = await fetch("/api/argo/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
          body: JSON.stringify({
            schoolCode: String(formData.get("schoolCode") || "").trim(),
            username: String(formData.get("username") || "").trim(),
            password: String(formData.get("password") || ""),
          }),
        });
        const result = await response.json();
        if (!response.ok) {
          if (response.status === 401 || response.status === 403) await refreshAppConfig();
          throw new Error(result?.error || `Importazione non riuscita (HTTP ${response.status}).`);
        }
        const imported = prepareArgoData(result);
        const importedAt = new Date().toISOString();
        localStorage.setItem("diario-argo-data", JSON.stringify({
          connected: true,
          importedAt,
          data: result,
        }));
        assignments = [...imported.assignments, ...localTasks.map(createLocalAssignment)];
        reminders = [...imported.reminders, ...localReminders.map(createLocalReminder)];
        argoConnected = true;
        argoImportedAt = importedAt;
        argoSyncStatus = `Importazione completata: ${assignments.length} compiti e ${reminders.length} promemoria.`;
        argoSyncFailed = false;
        if (!wasConnected) {
          currentPage = returnToAccountAfterArgo ? "Account" : "Home";
          returnToAccountAfterArgo = false;
        }
        document.querySelector("#argo-password").value = "";
        render();
      } catch (error) {
        argoSyncFailed = true;
        argoSyncStatus = `Importazione non riuscita: ${error.message}`;
        status.textContent = argoSyncStatus;
        status.classList.add("error");
        console.error("Non è stato possibile importare i dati da Argo.", error);
      } finally {
        submitButton.disabled = false;
      }
    }

          due,
          priority

          localTasks.pop();
          error.textContent = "Non è stato possibile salvare il compito su questo dispositivo.";

    content.addEventListener("focusout", event => {
      const field = event.target.closest(".profile-input:not([readonly])");
      if (!field || field.id === "new-subject") return;
      if (field.form?.id === "account-form") {
        if (!field.form.checkValidity()) {
          profileStatus = "Completa i campi richiesti e correggi i dati prima di uscire.";
          const status = document.querySelector("#save-status");
          if (status) status.textContent = profileStatus;
          return;
        }
        account = readAccountForm(field.form);
        if (field.name === "academicYear") account.academicYearAuto = false;
        profileStatus = persistAccount()
          ? "Modifiche salvate automaticamente."
          : "Salvataggio non riuscito. Verifica le impostazioni del browser.";
        const status = document.querySelector("#save-status");
        if (status) {
          status.textContent = profileStatus;
          status.classList.toggle("error", profileStatus.startsWith("Salvataggio non riuscito"));
        }
      }
      field.readOnly = true;
    });
    content.addEventListener("change", async event => {
      const imageField = event.target;
      if (imageField.id === "task-sort") {
        taskSortOrder = imageField.value;
        render();
        return;
      }
      if (imageField.id === "reminder-sort") {
        reminderSortOrder = imageField.value;
        render();
        return;
      }
      if (!["profile-cover-file", "profile-photo-file"].includes(imageField.id)) return;
      const file = imageField.files?.[0];
      if (!file) return;
      try {
        const field = imageField.id === "profile-cover-file" ? "coverImage" : "avatarImage";
        account[field] = await resizeProfileImage(file, field === "coverImage" ? 1400 : 480, field === "coverImage" ? 500 : 480);
        profileStatus = persistAccount()
          ? "Immagine salvata su questo dispositivo."
          : "Salvataggio non riuscito. Verifica lo spazio disponibile nel browser.";
      } catch (error) {
        profileStatus = error.message;
        console.error("Non è stato possibile aggiornare l'immagine del profilo.", error);
      } finally {
        imageField.value = "";
        updateProfile();
        render();
      }
    });
    content.addEventListener("keydown", event => {
      if (event.target.id === "chat-input" && event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        event.target.form.requestSubmit();
      }
    });
    search.addEventListener("input", render);
    document.querySelector("#auth-form").addEventListener("submit", event => {
      event.preventDefault();
      void login();
    });
    void refreshAppConfig();
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("/sw.js").catch(error => {
        console.error("Non è stato possibile attivare la modalità installabile.", error);
      });
    }
  </script>
</body>
</html>
